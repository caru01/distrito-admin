name: Deploy distrito-admin to Contabo VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Admin to Contabo VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false
          script: |
            echo "🚀 Iniciando despliegue de Distric House Admin..."

            TARGET_DIR="${{ secrets.VPS_ADMIN_PATH }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "/var/www/distrito-admin" ]; then
                TARGET_DIR="/var/www/distrito-admin"
              elif [ -d "/root/distrito-admin" ]; then
                TARGET_DIR="/root/distrito-admin"
              elif [ -d "$HOME/distrito-admin" ]; then
                TARGET_DIR="$HOME/distrito-admin"
              elif [ -d "/var/www/admin" ]; then
                TARGET_DIR="/var/www/admin"
              else
                echo "ℹ️ No se detectó carpeta local de distrito-admin en el VPS. Si usas Vercel, el admin se actualiza automáticamente con cada push."
                exit 0
              fi
            fi

            echo "📂 Navegando a $TARGET_DIR..."
            cd "$TARGET_DIR"

            echo "📥 Descargando cambios de Git..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Compilando aplicación..."
            npm install --no-audit --no-fund
            npm run build

            echo "🎉 ¡Compilación de Distric House Admin lista!"
